  save-usage: "<red>Indica un jugador: <white>/prueba save <jugador></white>"
  player-offline: "<red>Ese jugador no está conectado."
  player-loading: "<red>Los datos de ese jugador aún se están cargando."
  saved: "<green>Datos de <white>{player}</white> guardados."
  status-server: "<gray>Servidor: <white>{server}</white>"
  status-mongo-ok: "<gray>MongoDB: <green>conectado</green> <gray>({ms} ms)"
  status-mongo-fail: "<gray>MongoDB: <red>sin conexión"
  status-redis-on: "<gray>Redis: <green>activo"
  status-redis-off: "<gray>Redis: <yellow>desactivado"
  status-players: "<gray>Jugadores sincronizados: <white>{ready}</white> de <white>{online}</white>"
