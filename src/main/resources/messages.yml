  completed: "<green>Intercambio completado."
  cancelled: "<red>Intercambio cancelado."
  cancelled-by: "<red>Intercambio cancelado por <white>{player}</white>."
  cancelled-quit: "<red>Intercambio cancelado: el otro jugador se ha desconectado."
  cancelled-shutdown: "<red>Intercambio cancelado: el servidor se está apagando."
  gui:
    title: "<dark_aqua>Intercambio con {player}"
    confirm: "<yellow>Confirmar"
    confirm-lore: "<gray>Pulsa cuando la oferta te convenga."
    confirmed: "<green>Confirmado"
    confirmed-lore: "<gray>Pulsa para retirar tu confirmación."
    partner-ready: "<green>{player} ha confirmado"
    partner-waiting: "<yellow>Esperando a {player}..."
    summary: "<aqua>Estado del intercambio"
    summary-give: "<gray>Ofreces <white>{amount}</white> objeto(s)."
    summary-receive: "<gray>Recibes <white>{amount}</white> objeto(s)."




admin:
  usage: "<gray>Uso: <white>/prueba <status|save [jugador]|reload></white>"
  unknown-sub: "<red>Subcomando desconocido."
