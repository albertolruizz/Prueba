prefix: "<dark_gray>[<aqua>Prueba</aqua>]</dark_gray> "

generic:
  only-players: "Este comando solo funciona dentro del juego."
  still-loading: "<red>Tus datos aún se están cargando, espera un momento."

sync:
  load-failed: "<red>No se han podido cargar tus datos. Vuelve a entrar en unos segundos."
  apply-failed: "<red>No se han podido aplicar tus datos. Vuelve a entrar en unos segundos."

trade:
